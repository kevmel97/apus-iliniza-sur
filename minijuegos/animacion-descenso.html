<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descenso Iliniza Sur - ¡Y Vamos Por Más! - Fin del Juego</title>
    <style>
        :root {
            --pixel-font: 'Press Start 2P', monospace;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0b0f19;
            user-select: none;
            cursor: pointer;
        }
        .font-pixel {
            font-family: var(--pixel-font);
        }
        /* Renderizado nítido para Pixel Art */
        canvas {
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
            width: 100vw;
            height: 100vh;
        }
        /* Efecto CRT / Retro sutil */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.20) 50%,
                rgba(0, 0, 0, 0.20)
            );
            background-size: 100% 4px;
        }
        /* Sombras arcade sólidas para textos finales */
        .arcade-title {
            text-shadow:
                0 4px 0 #000,
                -3px 0 0 #000,
                3px 0 0 #000,
                0 -3px 0 #000,
                0 7px 0 #7c2d12;
        }
        .arcade-gameover {
            text-shadow:
                0 3px 0 #000,
                -2px 0 0 #000,
                2px 0 0 #000,
                0 -2px 0 #000,
                0 5px 0 #1e1b4b;
        }

        /* V26.3: estilos locales del epílogo, sin dependencia de Tailwind CDN. */
        #finale-overlay {
            position: fixed; inset: 0; z-index: 30; pointer-events: none;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 16px; transition: opacity .15s ease;
        }
        #msg-vamos {
            background: rgba(2, 6, 23, .93); border: 4px solid #fbbf24;
            padding: 14px 18px; border-radius: 5px; max-width: 95%;
            box-shadow: 0 6px 0 #000; text-align: center;
            transition: opacity .15s ease, transform .15s ease;
        }
        #msg-vamos p { color: #7dd3fc; font-size: clamp(7px, 1.5vw, 12px);
            letter-spacing: .08em; margin-bottom: 10px; line-height: 1.7; }
        #msg-vamos h1 { color: #fcd34d; font-size: clamp(13px, 3.2vw, 36px);
            line-height: 1.4; letter-spacing: .05em; }
        #msg-gameover { margin-top: 18px; background: rgba(69, 10, 10, .94);
            border: 2px solid #f87171; padding: 12px 16px;
            border-radius: 5px; box-shadow: 0 4px 0 #000;
            transition: opacity .15s ease; }
        #gameover-blink { color: white; font-size: clamp(11px, 2.6vw, 26px);
            line-height: 1.5; letter-spacing: .08em; }
        .opacity-0 { opacity: 0 !important; }
        .opacity-100 { opacity: 1 !important; }
        .scale-50 { transform: scale(.5) !important; }
        .scale-100 { transform: scale(1) !important; }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden">

    <!-- Canvas Principal Pixel Art a Pantalla Completa -->
    <canvas id="pixel-canvas"></canvas>

    <!-- Capa de Scanlines Retro -->
    <div class="scanlines pointer-events-none fixed inset-0 opacity-60 z-20"></div>

    <!-- Carteles Arcade Finales (aparecen tras el choque de Chugo y la cerveza) -->
    <div id="finale-overlay" class="pointer-events-none fixed inset-0 flex flex-col items-center justify-center px-4 z-30 opacity-0 transition-opacity duration-150">
        <!-- Mensaje 1: ¡Y VAMOS POR MÁS! -->
        <div id="msg-vamos" class="bg-slate-950/90 border-4 border-amber-400 px-4 py-3 sm:px-8 sm:py-5 rounded shadow-[0_6px_0_#000] text-center max-w-[95%] transform scale-50 opacity-0 transition-all duration-150">
            <p class="font-pixel text-[9px] sm:text-xs text-sky-300 tracking-widest uppercase mb-2">
                ★ DESCENSO EXTREMO ILINIZA SUR ★
            </p>
            <h1 class="font-pixel text-base sm:text-2xl md:text-4xl text-amber-300 arcade-title tracking-wider leading-snug">
                ¡Y VAMOS POR MÁS!
            </h1>
        </div>

        <!-- Mensaje 2: FIN DEL JUEGO -->
        <div id="msg-gameover" class="mt-4 sm:mt-6 bg-red-950/95 border-2 border-red-400 px-4 py-2 sm:px-6 sm:py-3 rounded shadow-[0_4px_0_#000] opacity-0 transition-opacity duration-150">
            <h2 id="gameover-blink" class="font-pixel text-xs sm:text-lg md:text-2xl text-white arcade-gameover tracking-widest">
                FIN DEL JUEGO
            </h2>
        </div>
    </div>

    <script>
        /***********************************************************************
         * 1. CONFIGURACIÓN DEL CANVAS AUTO-ADAPTABLE (16:9, 1:1, 9:16, 19:6, 6:19)
         *    Y CRONOLOGÍA DEL BUCLE DE 11 SEGUNDOS
         ***********************************************************************/
        const canvas = document.getElementById('pixel-canvas');
        const ctx = canvas.getContext('2d');

        const finaleOverlay = document.getElementById('finale-overlay');
        const msgVamos = document.getElementById('msg-vamos');
        const msgGameover = document.getElementById('msg-gameover');
        const gameoverBlink = document.getElementById('gameover-blink');

        // Duración del bucle completo en segundos
        const LOOP_DURATION = 11.0;
        // Instante exacto en el que Chugo se estrella contra la lente de la cámara
        const IMPACT_TIME = 4.6;
        // Instante en el que aparece "¡Y VAMOS POR MÁS!"
        const TEXT_VAMOS_TIME = 5.4;
        // Instante en el que aparece "FIN DEL JUEGO"
        const TEXT_GAMEOVER_TIME = 6.3;

        let startTime = performance.now();
        let logicalWidth = 384;
        let logicalHeight = 216;

        // Columnas de cerveza escurriendo por el lente tras el impacto
        let beerDripColumns = [];
        // Partículas de nieve levantadas al rodar y gotas de cerveza
        let snowBurstParticles = [];
        let snowflakes = [];
        let lastLoopSec = 0;

        function updateCanvasDimensions() {
            const winW = window.innerWidth || 384;
            const winH = window.innerHeight || 216;
            const aspect = winW / winH;

            // Densidad constante de ~82,944 píxeles lógicos para mantener el look Pixel Art en cualquier formato
            const targetArea = 82944;
            logicalHeight = Math.max(130, Math.round(Math.sqrt(targetArea / aspect)));
            logicalWidth = Math.max(130, Math.round(logicalHeight * aspect));

            canvas.width = logicalWidth;
            canvas.height = logicalHeight;

            initSnowParticles();
            initBeerDrips();
        }

        window.addEventListener('resize', updateCanvasDimensions);

        /***********************************************************************
         * 2. PARTÍCULAS DE NIEVE Y ESPUMA/CERVEZA EN LA LENTE
         ***********************************************************************/
        function initSnowParticles() {
            snowflakes = [];
            for (let i = 0; i < 105; i++) {
                snowflakes.push({
                    x: Math.random() * logicalWidth,
                    y: Math.random() * logicalHeight,
                    size: Math.random() < 0.72 ? 1 : 2,
                    speedY: 16 + Math.random() * 26,
                    speedX: -8 + Math.random() * 16,
                    phase: Math.random() * Math.PI * 2,
                    alpha: 0.55 + Math.random() * 0.45
                });
            }
        }

        function initBeerDrips() {
            beerDripColumns = [];
            const colWidth = 4;
            const numCols = Math.ceil(logicalWidth / colWidth) + 2;
            for (let i = 0; i < numCols; i++) {
                beerDripColumns.push({
                    x: i * colWidth,
                    w: colWidth + 1,
                    speedFactor: 0.55 + Math.sin(i * 0.7) * 0.25 + Math.random() * 0.45,
                    initialSplashH: 18 + Math.sin(i * 0.45) * 14 + Math.random() * 20,
                    foamThickness: 7 + Math.round(Math.random() * 8),
                    bubbleOffset: Math.random() * 40
                });
            }
        }

        function spawnSnowSplash(x, y, count, scaleSpeed = 1) {
            for (let i = 0; i < count; i++) {
                snowBurstParticles.push({
                    x: x + (Math.random() * 10 - 5),
                    y: y + (Math.random() * 8 - 4),
                    vx: (Math.random() - 0.35) * 45 * scaleSpeed,
                    vy: (-15 - Math.random() * 35) * scaleSpeed,
                    size: Math.random() > 0.45 ? 2 : 1,
                    color: Math.random() > 0.3 ? '#ffffff' : '#bae6fd',
                    life: 0.55 + Math.random() * 0.35
                });
            }
        }

        function spawnBeerSplashDrops(x, y, count) {
            for (let i = 0; i < count; i++) {
                snowBurstParticles.push({
                    x: x + (Math.random() * 16 - 8),
                    y: y + (Math.random() * 16 - 8),
                    vx: (Math.random() - 0.5) * 95,
                    vy: -35 - Math.random() * 60,
                    size: Math.random() > 0.4 ? 3 : 2,
                    color: Math.random() > 0.45 ? '#fef08a' : '#f59e0b',
                    life: 0.8 + Math.random() * 0.4
                });
            }
        }

        /***********************************************************************
         * 3. UTILIDADES DE DIBUJO PIXEL ART
         ***********************************************************************/
        function pxRect(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
        }

        function drawPixelPolygon(points, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(Math.round(points[0][0]), Math.round(points[0][1]));
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(Math.round(points[i][0]), Math.round(points[i][1]));
            }
            ctx.closePath();
            ctx.fill();
        }

        /***********************************************************************
         * 4. ESCENARIO DE DESCENSO: CIELO CREPUSCULAR, COTOPAXI Y LADERA DEL ILINIZA
         ***********************************************************************/
        function drawSkyAndClouds(camY, loopProgress) {
            const w = logicalWidth;
            const h = logicalHeight;

            const skyBands = [
                { stop: 0.00, color: '#212b4a' },
                { stop: 0.14, color: '#2b395e' },
                { stop: 0.27, color: '#3b4a70' },
                { stop: 0.38, color: '#58587a' },
                { stop: 0.48, color: '#865e6d' },
                { stop: 0.57, color: '#bd6c5e' },
                { stop: 0.66, color: '#e5834b' },
                { stop: 0.75, color: '#f5a153' },
                { stop: 0.84, color: '#fbc46e' },
                { stop: 0.92, color: '#fde293' }
            ];

            const skyShift = Math.round(camY * 0.18);
            for (let i = 0; i < skyBands.length; i++) {
                const yStart = Math.floor(skyBands[i].stop * h) + skyShift;
                const nextStop = (i < skyBands.length - 1) ? skyBands[i + 1].stop : 1.3;
                const bandH = Math.ceil((nextStop - skyBands[i].stop) * h) + 8;
                pxRect(0, yStart - 20, w, bandH, skyBands[i].color);
            }

            // Estrellas
            const stars = [
                [0.10, 0.06], [0.24, 0.11], [0.42, 0.08], [0.60, 0.12],
                [0.76, 0.07], [0.88, 0.14], [0.16, 0.18], [0.67, 0.17]
            ];
            stars.forEach((st, idx) => {
                if (Math.sin(loopProgress * Math.PI * 6 + idx) > 0) {
                    pxRect(st[0] * w, st[1] * h + skyShift, 1, 1, '#e2e8f0');
                }
            });

            // Nubes crepusculares
            const cloudDrift = Math.sin(loopProgress * Math.PI * 2) * 6;
            const clouds = [
                { x: 0.06 * w + cloudDrift, y: 0.22 * h + skyShift, w: 44, h: 3, c: '#74637f' },
                { x: 0.54 * w - cloudDrift, y: 0.18 * h + skyShift, w: 38, h: 3, c: '#74637f' },
                { x: 0.62 * w + cloudDrift, y: 0.31 * h + skyShift, w: 64, h: 4, c: '#c47164' },
                { x: 0.05 * w - cloudDrift, y: 0.36 * h + skyShift, w: 50, h: 4, c: '#d87b59' }
            ];
            clouds.forEach(cl => {
                pxRect(cl.x, cl.y, cl.w, cl.h, cl.c);
                pxRect(cl.x + 5, cl.y - 2, cl.w * 0.6, 2, cl.c);
            });
        }

        function drawDistantVolcano(camX, camY) {
            const w = logicalWidth;
            const h = logicalHeight;

            const isVertical = (h > w);
            const vPeakX = Math.round(w * (isVertical ? 0.35 : 0.38) + camX * 0.25);
            const vPeakY = Math.round(h * (isVertical ? 0.22 : 0.19) + camY * 0.32);
            const vBaseY = Math.round(h * (isVertical ? 0.58 : 0.60) + camY * 0.32);
            const vHalfW = Math.round(Math.max(w, h) * 0.32);

            // Silueta volcán Cotopaxi al fondo
            drawPixelPolygon([
                [vPeakX - 10, vPeakY],
                [vPeakX + 12, vPeakY],
                [vPeakX + vHalfW, vBaseY],
                [vPeakX - vHalfW, vBaseY]
            ], '#3b3c54');

            // Laderas rojizas andinas
            drawPixelPolygon([
                [vPeakX - 8, vPeakY + 8],
                [vPeakX + 10, vPeakY + 8],
                [vPeakX + vHalfW * 0.70, vBaseY - 8],
                [vPeakX - vHalfW * 0.56, vBaseY - 10]
            ], '#7c3f49');

            // Glaciar cumbre del volcán
            drawPixelPolygon([
                [vPeakX - 9, vPeakY],
                [vPeakX + 11, vPeakY],
                [vPeakX + vHalfW * 0.42, vPeakY + (vBaseY - vPeakY) * 0.46],
                [vPeakX + vHalfW * 0.18, vPeakY + (vBaseY - vPeakY) * 0.38],
                [vPeakX - vHalfW * 0.08, vPeakY + (vBaseY - vPeakY) * 0.48],
                [vPeakX - vHalfW * 0.42, vPeakY + (vBaseY - vPeakY) * 0.42]
            ], '#f8fafc');

            drawPixelPolygon([
                [vPeakX - 9, vPeakY],
                [vPeakX - 1, vPeakY],
                [vPeakX - vHalfW * 0.12, vPeakY + (vBaseY - vPeakY) * 0.42],
                [vPeakX - vHalfW * 0.42, vPeakY + (vBaseY - vPeakY) * 0.42]
            ], '#bae6fd');

            pxRect(vPeakX - 5, vPeakY + 3, 9, 3, '#473b54');

            // Valle de nubes en la base de la montaña
            const cloudY = vBaseY - 10;
            for (let cx = -20; cx < w + 30; cx += 22) {
                const wave = Math.round(Math.sin(cx * 0.09) * 4);
                pxRect(cx, cloudY + wave, 28, 18, '#938da8');
                pxRect(cx + 3, cloudY + wave - 3, 20, 4, '#c7b8c9');
                pxRect(cx, cloudY + wave + 9, 28, 30, '#6e6d8c');
            }
        }

        // Dibuja la gran pendiente nevada de descenso desde la cumbre (derecha arriba) hasta la base (izquierda abajo)
        function drawDescentSlopeAndBase(camX, camY) {
            const w = logicalWidth;
            const h = logicalHeight;

            const summitX = Math.round(w * 0.88 + camX);
            const summitY = Math.round(h * 0.25 + camY);
            const midSlopeX = Math.round(w * 0.48 + camX);
            const midSlopeY = Math.round(h * 0.56 + camY);
            const baseX = Math.round(w * 0.14 + camX);
            const baseY = Math.round(h * 0.82 + camY);

            // Riscos oscuros de roca bajo la rampa de nieve
            drawPixelPolygon([
                [w + 20, summitY - 12],
                [summitX, summitY],
                [midSlopeX, midSlopeY],
                [baseX, baseY],
                [-20, baseY + 12],
                [-20, h + 40],
                [w + 20, h + 40]
            ], '#1e2030');

            // Facetas de roca andina gris/azulada
            drawPixelPolygon([
                [summitX - 10, summitY + 18],
                [w + 15, summitY + 10],
                [w + 15, h + 30],
                [midSlopeX + 10, h + 30],
                [midSlopeX - 10, midSlopeY + 15]
            ], '#3b3f58');

            drawPixelPolygon([
                [midSlopeX - 8, midSlopeY + 14],
                [midSlopeX + 35, h + 20],
                [-15, h + 20],
                [-15, baseY + 10]
            ], '#2d3147');

            // Sombra celeste del glaciar en la pendiente
            drawPixelPolygon([
                [w + 20, summitY - 14],
                [summitX, summitY],
                [midSlopeX, midSlopeY],
                [baseX, baseY],
                [-20, baseY + 8],
                [-20, baseY + 26],
                [baseX + 8, baseY + 22],
                [midSlopeX + 6, midSlopeY + 20],
                [summitX + 8, summitY + 20],
                [w + 20, summitY + 10]
            ], '#93c5fd');

            // Capa blanca brillante de nieve por donde ruedan Jordy y Chugo
            drawPixelPolygon([
                [w + 20, summitY - 16],
                [summitX, summitY - 2],
                [midSlopeX, midSlopeY - 2],
                [baseX, baseY - 2],
                [-20, baseY + 4],
                [-20, baseY + 16],
                [baseX + 4, baseY + 12],
                [midSlopeX + 4, midSlopeY + 12],
                [summitX + 4, summitY + 12],
                [w + 20, summitY]
            ], '#f8fafc');

            // Carámbanos de hielo en los bordes de la cuesta
            for (let i = 0; i < 9; i++) {
                const t = i / 8;
                const ix = Math.round(baseX + (summitX - baseX) * t);
                const iy = Math.round(baseY + (summitY - baseY) * t + 10);
                pxRect(ix, iy, 3, 7 + (i % 3) * 4, '#bae6fd');
            }

            // Base de la montaña a la izquierda con campamento/banderín y montón de nieve suave
            pxRect(baseX - 24, baseY - 6, 38, 10, '#ffffff');
            pxRect(baseX - 22, baseY + 2, 36, 5, '#bae6fd');
            // Letrero pixelado de "BASE"
            pxRect(baseX - 20, baseY - 18, 2, 14, '#78350f');
            pxRect(baseX - 26, baseY - 22, 16, 7, '#f59e0b');
            pxRect(baseX - 24, baseY - 20, 12, 3, '#fef08a');

            return { summitX, summitY, midSlopeX, midSlopeY, baseX, baseY };
        }

        /***********************************************************************
         * 5. PERSONAJE 1: JORDY (CHAQUETA NARANJA) RODANDO SIN CONTROL
         *    HASTA LA BASE DE LA MONTAÑA
         ***********************************************************************/
        function drawJordyRollingToBase(slopeCoords, loopSec) {
            const { summitX, summitY, midSlopeX, midSlopeY, baseX, baseY } = slopeCoords;

            // Jordy rueda a toda velocidad desde t=0.2s hasta t=3.8s cuando se empotra en la nieve de la base
            const rollDuration = 3.5;
            const rawT = Math.max(0, Math.min(1, (loopSec - 0.15) / rollDuration));
            // Curva acelerada por la gravedad en la pendiente
            const t = 1 - Math.pow(1 - rawT, 1.65);

            // Posición interpolada sobre la cuesta de la montaña (de derecha-arriba a izquierda-abajo)
            let jx, jy;
            if (t < 0.5) {
                const st = t * 2;
                jx = summitX + (midSlopeX - summitX) * st;
                jy = summitY + (midSlopeY - summitY) * st;
            } else {
                const st = (t - 0.5) * 2;
                jx = midSlopeX + (baseX - midSlopeX) * st;
                jy = midSlopeY + (baseY - midSlopeY) * st;
            }

            // Rebotes locos mientras rueda por la pendiente
            const isRolling = rawT < 1.0 && loopSec > 0.15;
            const bounceOffset = isRolling
                ? Math.abs(Math.sin(loopSec * 14)) * (14 * (1 - rawT * 0.35))
                : 0;

            // Escala de perspectiva (más pequeño conforme llega lejos a la base de la montaña)
            const scale = 0.95 - t * 0.38;
            const currentY = jy - bounceOffset - 8;

            // Rastro de bola de nieve y partículas al rodar
            if (isRolling && Math.random() < 0.65) {
                spawnSnowSplash(jx + 4, currentY + 4, 2, 0.8);
            }

            ctx.save();
            ctx.translate(Math.round(jx), Math.round(currentY));
            ctx.scale(scale, scale);

            if (isRolling) {
                // Giro descontrolado en sentido antihorario bajando hacia la izquierda
                const spinAngle = -loopSec * 16.5;
                ctx.rotate(spinAngle);

                // Halo de bola de nieve acumulándose alrededor de Jordy
                const snowBallR = Math.round(13 + t * 6);
                pxRect(-snowBallR, -snowBallR + 3, snowBallR * 2, snowBallR * 2 - 6, 'rgba(241, 245, 249, 0.55)');
                pxRect(-snowBallR + 3, -snowBallR, snowBallR * 2 - 6, snowBallR * 2, 'rgba(255, 255, 255, 0.7)');

                // Dibujar a Jordy dando vueltas con brazos y piolets abiertos
                drawJordySpriteCentered(true, loopSec);
            } else {
                // Jordy ya llegó a la base de la montaña: enterrado de cabeza en un montículo de nieve con las botas amarillas pataleando arriba
                pxRect(-16, -2, 32, 12, '#ffffff');
                pxRect(-14, 6, 28, 6, '#93c5fd');

                const kick = Math.round(Math.sin(loopSec * 18) * 3);
                // Piernas oscuras saliendo de la nieve
                pxRect(-9, -15 + kick, 6, 13, '#1e293b');
                pxRect(3, -15 - kick, 6, 13, '#334155');
                // Botas amarillas pataleando al revés
                pxRect(-11, -20 + kick, 9, 6, '#facc15');
                pxRect(2, -20 - kick, 9, 6, '#facc15');
                // Un piolet clavado al lado con estrellitas de mareo
                pxRect(14, -16, 2, 16, '#f97316');
                pxRect(10, -18, 10, 3, '#e2e8f0');

                // Estrellitas girando sobre la nieve en la base
                const starX = Math.cos(loopSec * 8) * 10;
                pxRect(starX - 2, -26, 3, 3, '#fde047');
                pxRect(-starX, -24, 2, 2, '#f97316');
            }

            ctx.restore();
        }

        function drawJordySpriteCentered(flailing, timeSec) {
            // Centro del cuerpo en (0,0) para rotar como rueda
            // Mochila amarilla
            pxRect(5, -10, 8, 15, '#eab308');

            // Chaqueta naranja inflada
            pxRect(-9, -11, 18, 18, '#f97316');
            pxRect(-9, -5, 18, 1, '#9a3412');
            pxRect(-9, 1, 18, 1, '#9a3412');
            pxRect(-8, 5, 16, 3, '#ea580c'); // Arnés

            // Piernas agitándose
            pxRect(-9, 7, 7, 11, '#1e293b');
            pxRect(2, 7, 7, 11, '#334155');
            // Botas amarillas
            pxRect(-11, 17, 9, 5, '#facc15');
            pxRect(2, 17, 9, 5, '#facc15');

            // Brazos abiertos agitando los 2 piolets mientras rueda
            pxRect(-17, -14, 9, 5, '#f97316');
            pxRect(8, -14, 9, 5, '#f97316');
            // Piolets girando con él
            pxRect(-21, -22, 3, 12, '#1e293b');
            pxRect(-25, -23, 10, 3, '#e2e8f0');
            pxRect(17, -22, 3, 12, '#f97316');
            pxRect(14, -23, 10, 3, '#e2e8f0');

            // Cabeza con casco blanco y gafas oscuras
            pxRect(-7, -22, 14, 11, '#fed7aa');
            pxRect(-7, -19, 14, 4, '#0f172a'); // Gafas
            pxRect(-6, -18, 5, 2, '#38bdf8');
            pxRect(1, -18, 5, 2, '#38bdf8');
            // Boca abierta de "¡Aaaah!" pero riendo
            pxRect(-3, -14, 6, 3, '#ffffff');
            // Casco blanco
            pxRect(-8, -27, 16, 6, '#f8fafc');
            pxRect(-8, -22, 16, 2, '#94a3b8');
        }

        /***********************************************************************
         * 6. PERSONAJE 2: CHUGO (CHAQUETA AZUL) RODANDO CON SU CERVEZA HACIA
         *    LA CÁMARA Y ESTRELLÁNDOSE EN LA PANTALLA ("SCREEN SPLAT")
         ***********************************************************************/
        function drawChugoRollingToCamera(slopeCoords, loopSec) {
            const w = logicalWidth;
            const h = logicalHeight;

            // Fase A: Chugo viene rodando desde la cumbre (derecha) hacia el centro de la cámara (0.0s -> IMPACT_TIME)
            if (loopSec < IMPACT_TIME) {
                const progress = Math.max(0, loopSec / IMPACT_TIME);
                // Curva exponencial para que al final se acerque de golpe al lente
                const zoomCurve = Math.pow(progress, 2.35);

                const startX = slopeCoords.summitX - 18;
                const startY = slopeCoords.summitY - 6;
                const targetX = w * 0.5;
                const targetY = h * 0.52;

                const cx = startX + (targetX - startX) * Math.pow(progress, 1.15);
                const bounce = Math.abs(Math.sin(loopSec * 11.5)) * (18 * (1 - zoomCurve * 0.5));
                const cy = startY + (targetY - startY) * Math.pow(progress, 1.1) - bounce;

                // Escala crece desde 0.85x hasta 5.8x justo al estrellarse contra el lente
                const scale = 0.85 + zoomCurve * 5.2;
                const rotation = loopSec * 12.5;

                // Salpicaduras de nieve y espuma mientras rueda hacia nosotros
                if (Math.random() < 0.6) {
                    spawnSnowSplash(cx, cy + 10 * scale, 2, 1.1);
                }

                ctx.save();
                ctx.translate(Math.round(cx), Math.round(cy));
                ctx.scale(scale, scale);
                ctx.rotate(rotation);

                drawChugoSpriteWithBeer(false, loopSec);

                ctx.restore();
            } else {
                // Fase B: ¡IMPACTO CONTRA EL LENTE! Chugo queda estampado contra el cristal de la cámara y se va resbalando lentamente hacia abajo
                const afterImpact = loopSec - IMPACT_TIME;
                const slideDown = Math.min(h * 0.42, Math.pow(afterImpact, 1.35) * 26);

                const splatScale = Math.max(2.8, Math.min(4.5, (Math.min(w, h) / 68)));
                const cx = w * 0.5;
                const cy = h * 0.48 + slideDown;

                ctx.save();
                ctx.translate(Math.round(cx), Math.round(cy));
                // Efecto squash elástico en los primeros 0.35s tras chocar
                const squashX = afterImpact < 0.35 ? 1.22 - afterImpact * 0.5 : 1.05;
                const squashY = afterImpact < 0.35 ? 0.82 + afterImpact * 0.4 : 0.96;
                ctx.scale(splatScale * squashX, splatScale * squashY);

                drawChugoSpriteWithBeer(true, loopSec);

                ctx.restore();
            }
        }

        function drawChugoSpriteWithBeer(isSplattedOnLens, timeSec) {
            // Mochila azul oscuro
            pxRect(6, -12, 9, 16, '#1e293b');

            // Piernas (pantalón naranja) abiertas contra el vidrio
            const legSpread = isSplattedOnLens ? 4 : 0;
            pxRect(-10 - legSpread, 7, 7, 12, '#ea580c');
            pxRect(3 + legSpread, 7, 7, 12, '#ea580c');

            // Botas azules
            pxRect(-13 - legSpread, 17, 10, 6, '#1d4ed8');
            pxRect(3 + legSpread, 17, 10, 6, '#1d4ed8');

            // Torso chaqueta azul
            pxRect(-11, -11, 22, 19, '#2563eb');
            pxRect(-10, -5, 20, 1, '#1e3a8a');
            pxRect(-10, 1, 20, 1, '#1e3a8a');
            pxRect(-1, -11, 2, 19, '#172554');

            // Brazo izquierdo pegado al vidrio
            pxRect(10, -9, 8, 6, '#1d4ed8');
            pxRect(16, -9, 5, 5, '#fed7aa');

            // Cabeza con barba y casco naranja
            pxRect(-9, -24, 18, 14, '#fed7aa');

            if (isSplattedOnLens) {
                // Mejillas y nariz aplastadas cómicamente contra el lente de la cámara
                pxRect(-10, -19, 20, 6, '#fdba74');
                pxRect(-3, -18, 6, 4, '#fb923c'); // Nariz chata contra el vidrio
                // Ojos en espiral / felices de impacto
                pxRect(-7, -21, 4, 3, '#0f172a');
                pxRect(-6, -20, 2, 1, '#ffffff');
                pxRect(3, -21, 4, 3, '#0f172a');
                pxRect(4, -20, 2, 1, '#ffffff');
            } else {
                pxRect(-6, -20, 3, 2, '#0f172a');
                pxRect(3, -20, 3, 2, '#0f172a');
            }

            // Barba oscura tupida y gran sonrisa blanca
            pxRect(-9, -15, 18, 6, '#27272a');
            pxRect(-5, -14, 10, 3, '#ffffff');

            // Casco naranja con ventilaciones
            pxRect(-10, -30, 20, 7, '#ea580c');
            pxRect(-8, -32, 16, 3, '#f97316');
            pxRect(-5, -29, 2, 2, '#1e293b');
            pxRect(3, -29, 2, 2, '#1e293b');

            // Brazo derecho sosteniendo la jarra de cerveza (que al chocar se vuelca sobre el lente)
            pxRect(-18, -12, 8, 7, '#2563eb');
            pxRect(-21, -12, 5, 5, '#fed7aa');

            // Jarra de cerveza gigante
            const mugX = -28;
            const mugY = isSplattedOnLens ? -14 : -18;
            // Asa
            pxRect(mugX - 3, mugY + 2, 3, 7, '#e2e8f0');
            // Jarra de vidrio
            pxRect(mugX, mugY, 10, 12, '#fef08a');
            if (!isSplattedOnLens) {
                // Cerveza dorada llena antes de regarse
                pxRect(mugX + 1, mugY + 2, 8, 9, '#f59e0b');
                pxRect(mugX - 1, mugY - 3, 12, 4, '#ffffff');
            } else {
                // Jarra volcada derramando espuma y cerveza directamente contra la pantalla
                pxRect(mugX + 1, mugY + 4, 8, 7, 'rgba(254, 240, 138, 0.55)');
                pxRect(mugX - 4, mugY - 2, 16, 8, '#ffffff');
                pxRect(mugX - 2, mugY + 3, 14, 10, '#f59e0b');
            }
        }

        /***********************************************************************
         * 7. EFECTO DE CERVEZA DERRAMADA ESCURRIENDO POR TODA LA PANTALLA
         ***********************************************************************/
        function drawBeerSpillOnCameraLens(loopSec) {
            if (loopSec < IMPACT_TIME) return;

            const elapsedSinceImpact = loopSec - IMPACT_TIME;
            const w = logicalWidth;
            const h = logicalHeight;

            // Flash blanco/dorado de espuma en los primeros 0.12s del choque
            if (elapsedSinceImpact < 0.12) {
                ctx.fillStyle = 'rgba(254, 240, 138, 0.75)';
                ctx.fillRect(0, 0, w, h);
            }

            // Cada columna de cerveza cae desde el punto del impacto y desde arriba cubriendo la pantalla
            for (let i = 0; i < beerDripColumns.length; i++) {
                const col = beerDripColumns[i];
                // Progreso de caída de esta columna de cerveza
                const dripDistance = elapsedSinceImpact * h * 0.48 * col.speedFactor;
                const currentBottomY = Math.min(h + 25, Math.round(col.initialSplashH + dripDistance));

                if (currentBottomY > 0) {
                    // Cuerpo líquido dorado ámbar translúcido de la cerveza
                    ctx.fillStyle = 'rgba(245, 158, 11, 0.72)';
                    ctx.fillRect(col.x, 0, col.w, Math.max(0, currentBottomY - col.foamThickness));

                    // Reflejo brillante amarillo cerveza
                    if (i % 2 === 0) {
                        ctx.fillStyle = 'rgba(253, 224, 71, 0.45)';
                        ctx.fillRect(col.x + 1, 0, 2, Math.max(0, currentBottomY - col.foamThickness - 4));
                    }

                    // Borde inferior de espuma blanca cremosa escurriendo
                    const foamY = Math.max(0, currentBottomY - col.foamThickness);
                    pxRect(col.x, foamY, col.w, col.foamThickness, '#ffffff');
                    pxRect(col.x, foamY - 2, col.w, 3, '#fef9c3');

                    // Burbujas subiendo dentro de la cerveza derramada en el lente
                    const bubbleY = Math.round((currentBottomY - 12 - (elapsedSinceImpact * 28 + col.bubbleOffset)) % Math.max(10, currentBottomY - 8));
                    if (bubbleY > 4 && bubbleY < currentBottomY - col.foamThickness - 2) {
                        pxRect(col.x + 1, bubbleY, 2, 2, '#fef9c3');
                    }
                }
            }
        }

        /***********************************************************************
         * 8. MÚSICA MIDI Y EFECTOS DE SONIDO 8-BIT (DESCENSO, CHOQUE Y FIN DEL JUEGO)
         ***********************************************************************/
        let audioCtx = null;
        let isPlayingAudio = false;
        // APUS_AUDIO_ESCENAS_V3153: conservar el audio ORIGINAL del descenso.
        let apusDescentSoundEnabled=true;
        let apusDescentFxVolume=1;
        window.addEventListener('message', e=>{
          if(e.source!==window.parent||e.data?.apusDescent!=='SOUND')return;
          apusDescentSoundEnabled=e.data.enabled!==false;
          if(Number.isFinite(e.data.fxVolume))apusDescentFxVolume=Math.max(0,Math.min(1,e.data.fxVolume));
          if(!apusDescentSoundEnabled||apusDescentFxVolume===0)isPlayingAudio=false;
          else ensureAudioStarted();
        });
        let lastMidiNoteTime = 0;
        let noteCursor = 0;
        let crashSoundPlayedInCycle = false;
        let fanfarePlayedInCycle = false;

        // Melodía frenética y cómica para la bajada rodando (0.0s -> 4.6s)
        const ROLLING_NOTES = [
            { f: 659.25, b: 329.63, d: 0.11 }, // E5
            { f: 587.33, b: 293.66, d: 0.11 }, // D5
            { f: 523.25, b: 261.63, d: 0.11 }, // C5
            { f: 493.88, b: 246.94, d: 0.11 }, // B4
            { f: 587.33, b: 293.66, d: 0.11 }, // D5
            { f: 523.25, b: 261.63, d: 0.11 }, // C5
            { f: 440.00, b: 220.00, d: 0.11 }, // A4
            { f: 392.00, b: 196.00, d: 0.11 }, // G4
            { f: 523.25, b: 261.63, d: 0.11 }, // C5
            { f: 493.88, b: 246.94, d: 0.11 }, // B4
            { f: 440.00, b: 220.00, d: 0.11 }, // A4
            { f: 392.00, b: 196.00, d: 0.11 }  // G4
        ];

        // Fanfarria arcade triunfal tras el choque ("¡Y VAMOS POR MÁS! / FIN DEL JUEGO")
        const FINALE_FANFARE = [
            { f: 523.25, b: 261.63, d: 0.15 }, // C5
            { f: 659.25, b: 329.63, d: 0.15 }, // E5
            { f: 783.99, b: 392.00, d: 0.15 }, // G5
            { f: 1046.50, b: 523.25, d: 0.35 }, // C6
            { f: 783.99, b: 392.00, d: 0.18 }, // G5
            { f: 1046.50, b: 523.25, d: 0.55 }  // C6
        ];

        function playTone(freq, bassFreq, duration, waveType = 'square') {
            if (!isPlayingAudio || !audioCtx || audioCtx.state !== 'running') return;
            const now = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = waveType;
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.07*apusDescentFxVolume, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.92);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + duration);

            if (bassFreq) {
                const bass = audioCtx.createOscillator();
                const bGain = audioCtx.createGain();
                bass.type = 'triangle';
                bass.frequency.setValueAtTime(bassFreq * 0.5, now);
                bGain.gain.setValueAtTime(0.10*apusDescentFxVolume, now);
                bGain.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.95);
                bass.connect(bGain);
                bGain.connect(audioCtx.destination);
                bass.start(now);
                bass.stop(now + duration);
            }
        }

        // Efecto de sonido chiptune de choque contra el vidrio + cerveza regándose
        function playCrashAndBeerSplashSound() {
            if (!isPlayingAudio || !audioCtx || audioCtx.state !== 'running') return;
            const now = audioCtx.currentTime;

            // 1. Golpe grave de impacto contra la cámara
            const oscHit = audioCtx.createOscillator();
            const gainHit = audioCtx.createGain();
            oscHit.type = 'sawtooth';
            oscHit.frequency.setValueAtTime(190, now);
            oscHit.frequency.exponentialRampToValueAtTime(38, now + 0.38);
            gainHit.gain.setValueAtTime(0.20*apusDescentFxVolume, now);
            gainHit.gain.exponentialRampToValueAtTime(0.001, now + 0.40);
            oscHit.connect(gainHit);
            gainHit.connect(audioCtx.destination);
            oscHit.start(now);
            oscHit.stop(now + 0.42);

            // 2. Burbujeo líquido de cerveza derramándose por la pantalla
            for (let i = 0; i < 14; i++) {
                const bOsc = audioCtx.createOscillator();
                const bGain = audioCtx.createGain();
                const startT = now + 0.08 + i * 0.055;
                bOsc.type = 'sine';
                const baseF = 320 + Math.random() * 520;
                bOsc.frequency.setValueAtTime(baseF, startT);
                bOsc.frequency.exponentialRampToValueAtTime(baseF * 1.45, startT + 0.05);
                bGain.gain.setValueAtTime(0.05*apusDescentFxVolume, startT);
                bGain.gain.exponentialRampToValueAtTime(0.001, startT + 0.055);
                bOsc.connect(bGain);
                bGain.connect(audioCtx.destination);
                bOsc.start(startT);
                bOsc.stop(startT + 0.06);
            }
        }

        function playFinaleFanfareSequence() {
            if (!isPlayingAudio || !audioCtx || audioCtx.state !== 'running') return;
            let offsetMs = 0;
            FINALE_FANFARE.forEach(note => {
                setTimeout(() => {
                    if (isPlayingAudio) {
                        playTone(note.f, note.b, note.d, 'square');
                    }
                }, offsetMs);
                offsetMs += note.d * 1000;
            });
        }

        function updateAudioForLoop(loopSec, nowMs) {
            if (!isPlayingAudio || !audioCtx || audioCtx.state !== 'running') return;

            // Durante la rodada (0 a 4.6s): música rápida de descenso + rebotes
            if (loopSec < IMPACT_TIME) {
                /* Música original de esta escena: solo descenso, no fondo MP3. */
                if (nowMs - lastMidiNoteTime > 115) {
                    const n = ROLLING_NOTES[noteCursor % ROLLING_NOTES.length];
                    // Aumentar ligeramente el tono a medida que Chugo se acerca a la cámara
                    const pitchMultiplier = 1 + (loopSec / IMPACT_TIME) * 0.25;
                    playTone(n.f * pitchMultiplier, n.b, n.d, 'square');
                    noteCursor++;
                    lastMidiNoteTime = nowMs;
                }
            } else if (loopSec >= IMPACT_TIME && !crashSoundPlayedInCycle) {
                crashSoundPlayedInCycle = true;
                playCrashAndBeerSplashSound();
            }

            if (loopSec >= TEXT_VAMOS_TIME && !fanfarePlayedInCycle) {
                fanfarePlayedInCycle = true;
                playFinaleFanfareSequence();
            }
        }

        function ensureAudioStarted() {
            if(!apusDescentSoundEnabled||apusDescentFxVolume===0)return;
            try {
                if (!audioCtx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContextClass();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume().then(() => {
                        isPlayingAudio = apusDescentSoundEnabled && apusDescentFxVolume>0;
                    }).catch(() => {});
                } else {
                    isPlayingAudio = apusDescentSoundEnabled && apusDescentFxVolume>0;
                }
            } catch (e) {
                // Ignorar bloqueo de autoplay hasta interacción
            }
        }

        // Los toques reactivan sonido bloqueado por autoplay; ya no lo silencian.
        // Silenciar se gobierna exclusivamente desde las preferencias generales.
        window.addEventListener('pointerdown', () => {
            if(apusDescentSoundEnabled&&(!audioCtx||audioCtx.state==='suspended'||!isPlayingAudio)){
                ensureAudioStarted();
            }
        });

        /***********************************************************************
         * 9. BUCLE PRINCIPAL DE ANIMACIÓN Y SINCRONIZACIÓN DE CÁMARA / TEXTOS
         ***********************************************************************/
        let lastFrameTime = performance.now();

        function animate(now) {
            const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
            lastFrameTime = now;

            const totalElapsed = (now - startTime) / 1000;
            const loopSec = Math.min(totalElapsed, LOOP_DURATION - 0.5); // Epílogo: una sola reproducción y se queda en la pantalla final.
            const loopProgress = loopSec / LOOP_DURATION;

            // Detectar reinicio del ciclo de 11 segundos
            if (loopSec < lastLoopSec) {
                crashSoundPlayedInCycle = false;
                fanfarePlayedInCycle = false;
                noteCursor = 0;
                initBeerDrips();
            }
            lastLoopSec = loopSec;

            // Explosión de gotas de cerveza justo en el fotograma de impacto
            if (loopSec >= IMPACT_TIME && loopSec - dt < IMPACT_TIME) {
                spawnBeerSplashDrops(logicalWidth * 0.5, logicalHeight * 0.45, 36);
            }

            // Actualizar música MIDI y efectos según el segundo actual del bucle
            updateAudioForLoop(loopSec, now);

            // Movimiento de cámara acompañando la bajada + fuerte sacudida (Screen Shake) al estrellarse Chugo
            let camX = 0;
            let camY = 0;

            if (loopSec < IMPACT_TIME) {
                const descentRatio = loopSec / IMPACT_TIME;
                // Paneo siguiendo la pendiente + vibración de bajada
                camY = -12 + descentRatio * 24 + Math.sin(loopSec * 22) * 1.2;
                camX = 8 - descentRatio * 16 + Math.cos(loopSec * 18) * 1.2;
            } else {
                const impactElapsed = loopSec - IMPACT_TIME;
                // Fuerte temblor de cámara cuando Chugo se estrella contra el lente
                const shakeDecay = Math.max(0, 1 - impactElapsed * 1.4);
                const shakeAmp = shakeDecay * 14;
                camX = -8 + (Math.random() - 0.5) * 2 * shakeAmp;
                camY = 12 + (Math.random() - 0.5) * 2 * shakeAmp;
            }

            // 1. Pintar Cielo Crepuscular
            drawSkyAndClouds(camY, loopProgress);

            // 2. Pintar Volcán Nevado al Fondo
            drawDistantVolcano(camX, camY);

            // 3. Pintar la Ladera Empinada del Iliniza Sur y la Base
            const slopeCoords = drawDescentSlopeAndBase(camX, camY);

            // 4. Pintar a Jordy rodando sin control hasta la base de la montaña
            drawJordyRollingToBase(slopeCoords, loopSec);

            // 5. Pintar partículas de nieve y gotas de cerveza en el aire
            for (let i = snowBurstParticles.length - 1; i >= 0; i--) {
                const p = snowBurstParticles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += 65 * dt; // Gravedad
                p.life -= dt;
                if (p.life <= 0) {
                    snowBurstParticles.splice(i, 1);
                } else {
                    pxRect(p.x, p.y, p.size, p.size, p.color);
                }
            }

            // 6. Pintar a Chugo rodando hacia la cámara y estrellándose contra el lente
            drawChugoRollingToCamera(slopeCoords, loopSec);

            // 7. Pintar la cerveza espumosa regándose por toda la pantalla tras el impacto
            drawBeerSpillOnCameraLens(loopSec);

            // 8. Pintar Nieve cayendo continuamente
            for (let i = 0; i < snowflakes.length; i++) {
                const s = snowflakes[i];
                s.y += s.speedY * dt;
                s.x += (s.speedX + Math.sin(totalElapsed * 2 + s.phase) * 8) * dt;

                if (s.y > logicalHeight + 4) {
                    s.y = -4;
                    s.x = Math.random() * logicalWidth;
                }
                if (s.x > logicalWidth + 4) s.x = -4;
                if (s.x < -4) s.x = logicalWidth + 4;

                ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
                ctx.fillRect(Math.round(s.x), Math.round(s.y), s.size, s.size);
            }

            // 9. Controlar la visibilidad de los textos arcade "¡Y VAMOS POR MÁS!" y "FIN DEL JUEGO"
            if (loopSec >= TEXT_VAMOS_TIME && loopSec < LOOP_DURATION - 0.25) {
                finaleOverlay.classList.remove('opacity-0');
                finaleOverlay.classList.add('opacity-100');

                msgVamos.classList.remove('opacity-0', 'scale-50');
                msgVamos.classList.add('opacity-100', 'scale-100');

                if (loopSec >= TEXT_GAMEOVER_TIME) {
                    msgGameover.classList.remove('opacity-0');
                    msgGameover.classList.add('opacity-100');
                    // Parpadeo clásico de máquina arcade para "FIN DEL JUEGO"
                    const blinkOn = Math.floor(loopSec * 4) % 2 === 0;
                    gameoverBlink.style.opacity = blinkOn ? '1' : '0.25';
                } else {
                    msgGameover.classList.add('opacity-0');
                    msgGameover.classList.remove('opacity-100');
                }
            } else {
                finaleOverlay.classList.add('opacity-0');
                finaleOverlay.classList.remove('opacity-100');
                msgVamos.classList.add('opacity-0', 'scale-50');
                msgVamos.classList.remove('opacity-100', 'scale-100');
                msgGameover.classList.add('opacity-0');
                msgGameover.classList.remove('opacity-100');
            }

            requestAnimationFrame(animate);
        }

        window.onload = function () {
            updateCanvasDimensions();
            ensureAudioStarted();
            requestAnimationFrame(animate);
        };
    </script>
</body>
